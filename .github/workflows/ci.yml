name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Pad Layouts up to date
        run: |
          npm run layouts
          git diff --exit-code -- src/lib/glyph/layouts/pad-layouts.generated.ts \
            || (echo "::error::pad-layouts.generated.ts is out of date. Run 'npm run layouts' and commit the result." && exit 1)

      - name: Symbols up to date
        run: |
          npm run symbols
          git diff --exit-code -- src/lib/glyph/symbols/symbols.generated.ts \
            || (echo "::error::symbols.generated.ts is out of date. Run 'npm run symbols' and commit the result." && exit 1)

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright + axe)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
